# Compose 2.24.4+; use behind an HTTPS reverse proxy on this host.
services:
  api:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://okr:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@db:5432/okr?schema=public
      APP_URL: ${APP_URL:?Set your public HTTPS APP_URL}
      COOKIE_SECURE: 'true'
  worker:
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://okr:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD}@db:5432/okr?schema=public
      APP_URL: ${APP_URL:?Set your public HTTPS APP_URL}
      COOKIE_SECURE: 'true'
  web:
    ports: !override
      - 127.0.0.1:${WEB_PORT:-8080}:80
