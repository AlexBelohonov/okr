map $request_uri $application_csp {
  default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
  ~^/api/docs(/|$) "";
}
log_format safe_access '$remote_addr $request_method $uri $status $body_bytes_sent';
upstream okr_api {
  zone okr_api 64k;
  resolver 127.0.0.11 valid=1s ipv6=off;
  resolver_timeout 5s;
  server api:3000 resolve;
}
server {
  access_log /var/log/nginx/access.log safe_access;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 1m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy $application_csp always;
  location /api/ {
    proxy_pass http://okr_api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
